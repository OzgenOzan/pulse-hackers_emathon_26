name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # `fallback` ships the static jury page (scripts/pages-fallback); `interactive` ships the Pyodide site.
  PAGES_VARIANT: fallback
  PLAYWRIGHT_VERSION: "1.58.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make test

  browser-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pydantic==2.12.5" "pydantic-core==2.41.5"
      - run: python -m pytest -c backend/pytest.ini backend/tests

  build:
    needs: [test, browser-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        if: env.PAGES_VARIANT == 'interactive'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v6
        if: env.PAGES_VARIANT == 'interactive'
        with:
          path: ~/.cache/pulse-hackers-pages
          key: pages-pyodide-0.29.5-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install build tools
        run: make setup
        if: env.PAGES_VARIANT == 'interactive'
      - name: Build the interactive site
        if: env.PAGES_VARIANT == 'interactive'
        run: make pages
      - name: Build the static fallback
        if: env.PAGES_VARIANT == 'fallback'
        run: make pages-fallback
      - name: Install Playwright for the smoke test
        run: |
          python -m pip install "playwright==${PLAYWRIGHT_VERSION}"
          python -m playwright install --with-deps chromium
      - name: Smoke test the interactive site
        if: env.PAGES_VARIANT == 'interactive'
        run: python scripts/smoke_pages.py
      - name: Smoke test the static fallback
        if: env.PAGES_VARIANT == 'fallback'
        run: python scripts/smoke_pages.py --fallback
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
